<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - HNA Shop</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f8f9fa;
        }
        header {
            background-color: #343a40;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 20px;
        }
        .user-info {
            font-size: 14px;
        }
        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }
        .card h3 {
            margin-bottom: 15px;
            color: #007bff;
            border-bottom: 2px solid #007bff;
            padding-bottom: 8px;
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        table th, table td {
            border: 1px solid #dee2e6;
            padding: 12px;
            text-align: left;
        }
        table th {
            background-color: #e9ecef;
            color: #495057;
        }
        table tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        .actions {
            display: flex;
            gap: 6px;
        }
        .actions form {
            display: inline;
        }
        .btn {
            display: inline-block;
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }
        .btn-add    { background-color: #28a745; padding: 8px 16px; font-size: 14px; }
        .btn-edit   { background-color: #ffc107; color: #333; }
        .btn-delete { background-color: #dc3545; }
        .alert {
            background-color: #d4edda;
            color: #155724;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Simple Shop - Cửa hàng đồ công nghệ</h1>
        <div class="user-info">
            Xin chào, <strong th:text="${username} ?: 'Admin'"></strong> |
            <a th:href="@{/login}" style="color: #ffc107; text-decoration: none;">Đăng xuất</a>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <h3>Danh Mục Sản Phẩm</h3>

            <!-- Thông báo sau khi thêm / sửa / xóa -->
            <div class="alert" th:if="${message}" th:text="${message}"></div>

            <div class="toolbar">
                <span></span>
                <a class="btn btn-add" th:href="@{/products/new}">+ Thêm sản phẩm</a>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Mã</th>
                        <th>Tên danh mục</th>
                        <th>Giá bán</th>
                        <th>Số lượng tồn kho</th>
                        <th>Đường dẫn URL</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="p : ${productList}">
                        <td th:text="${p.id}"></td>
                        <td th:text="${p.name} ?: 'Chưa có tên'"></td>
                        <td th:text="${p.price != null} ? ${#numbers.formatDecimal(p.price, 0, 'POINT', 0, 'COMMA')} + ' VNĐ' : '0 VNĐ'"></td>
                        <td th:text="${p.quantity != null} ? ${p.quantity} : 0"></td>
                        <td th:text="${p.image_url}"></td>
                        <td>
                            <div class="actions">
                                <!-- Nút Sửa: mở form với dữ liệu cũ -->
                                <a class="btn btn-edit" th:href="@{/products/edit/{id}(id=${p.id})}">Sửa</a>

                                <!-- Nút Xóa: gửi POST, hỏi xác nhận trước -->
                                <form th:action="@{/products/delete/{id}(id=${p.id})}" method="post"
                                      onsubmit="return confirm('Bạn chắc chắn muốn xóa sản phẩm này?');">
                                    <button type="submit" class="btn btn-delete">Xóa</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(productList)}">
                        <td colspan="6" style="text-align:center;">Chưa có sản phẩm nào trong cơ sở dữ liệu</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
